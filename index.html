<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>알콩이 징검다리</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* 한 화면 게임: 위에 알콩이 무대, 아래에 둥근 버튼. 연두 들판과 하늘색 강 */
:root{
--bg:#EEF5E6;--card:#FFFFFF;--ink:#1F3324;--muted:#5C6E5B;--line:#D5E2CC;
--leaf:#3B6D11;--leaf2:#639922;--leaf3:#C0DD97;--river:#85B7EB;--river2:#378ADD;--sand:#FAEEDA;
--ok:#E3F1D3;--okink:#27500A;--no:#FCE3E3;--noink:#8A1F1F;--gold:#EF9F27;
--disp:"Gowun Dodum","Noto Sans KR",system-ui,sans-serif;--body:"Noto Sans KR",system-ui,sans-serif;
color-scheme:light}
*{box-sizing:border-box}[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55;
padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 32px}
.wrap{max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
h1,h2{font-family:var(--disp);font-weight:400;margin:0;text-wrap:balance}
h1{font-size:28px;letter-spacing:-.5px}h2{font-size:21px}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible{outline:3px solid var(--river2);outline-offset:2px}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.icon{width:40px;height:40px;border-radius:50%;background:var(--card);border:1.5px solid var(--line);display:grid;place-items:center;font-size:15px}
.stage{width:152px;height:168px;border-radius:28px;overflow:hidden;flex:none;background:var(--card)}
.stage svg{display:block}
.hero{display:flex;gap:16px;align-items:center;background:var(--card);border-radius:28px;padding:14px;border:1.5px solid var(--line)}
.chips{display:flex;flex-direction:column;gap:8px;min-width:0}
.chip{display:flex;justify-content:space-between;gap:10px;background:var(--bg);border-radius:999px;padding:6px 14px;font-size:14px}
.chip b{font-weight:700;font-variant-numeric:tabular-nums}
.big{width:100%;border-radius:999px;padding:16px;font-size:19px;font-family:var(--disp);background:var(--leaf2);color:#fff}
.big:active,.opt:active,.pill:active{transform:scale(.98)}
.row2{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.mid{border-radius:22px;padding:12px 6px;background:var(--card);border:1.5px solid var(--line);font-size:15px;display:flex;flex-direction:column;align-items:center;gap:2px}
.mid small{color:var(--muted);font-size:12px}
.card{background:var(--card);border:1.5px solid var(--line);border-radius:24px;padding:16px}
.lab{font-size:13px;color:var(--muted);letter-spacing:.3px;margin-bottom:8px}
.weeks{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.wk{border-radius:18px;background:var(--bg);padding:8px 2px 6px;display:flex;flex-direction:column;align-items:center;font-size:13px;border:2px solid transparent}
.wk canvas{width:40px;height:36px;image-rendering:pixelated}
.wk.on,.seg button.on,.tab.on{border-color:var(--leaf2);background:var(--ok)}
.wk.all{grid-column:span 5;flex-direction:row;justify-content:center;gap:8px;padding:10px}
.seg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.seg button{border-radius:999px;background:var(--bg);padding:10px;font-size:15px;border:2px solid transparent}
.river{position:relative;height:150px;border-radius:24px;overflow:hidden;background:var(--river)}
.strip{position:absolute;inset:0;transition:transform .55s cubic-bezier(.35,0,.4,1)}
.stone{position:absolute;bottom:18px;width:64px;height:20px;border-radius:50%;background:#D3D1C7;border-bottom:4px solid #B4B2A9}
.bank{position:absolute;bottom:0;height:40px;background:var(--leaf3);border-top:4px solid var(--leaf2)}
.wave{position:absolute;height:3px;width:18px;border-radius:2px;background:#E6F1FB;opacity:.8}
#al{position:absolute;bottom:30px;width:76px;height:84px;transition:left .55s cubic-bezier(.35,0,.4,1)}
#al svg{transform-origin:50% 100%;display:block}
.crouch{transform:scale(1.12,.82)}
.air{animation:air .55s cubic-bezier(.3,0,.7,1)}
@keyframes air{50%{transform:translateY(-46px) rotate(-6deg)}}
.land{animation:land .25s}
@keyframes land{40%{transform:scale(1.14,.84)}}
.sink{animation:sink .75s forwards}
@keyframes sink{30%{transform:translateY(-24px)}100%{transform:translateY(70px)}}
.yay{animation:yay .45s 4}
@keyframes yay{50%{transform:translateY(-16px)}}
.drop{position:absolute;width:6px;height:6px;background:#E6F1FB;bottom:26px;animation:dr .6s forwards}
@keyframes dr{50%{transform:translate(var(--x),-30px)}100%{transform:translate(calc(var(--x)*1.6),0);opacity:0}}
#msg{position:absolute;top:10px;left:0;right:0;text-align:center;font-family:var(--disp);font-size:22px;color:#0C447C;opacity:0;transition:opacity .2s}
.prog{display:flex;justify-content:space-between;font-size:14px;color:var(--muted)}
.q{font-size:19px;line-height:1.6;text-align:center;font-family:var(--disp);word-break:keep-all}
.q small{display:block;font-family:var(--body);font-size:13px;color:var(--muted);margin-top:6px}
.qt{font-size:13px;color:var(--leaf);text-align:center;margin-bottom:6px}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{width:100%;text-align:left;border-radius:20px;padding:12px 16px;background:var(--card);border:2px solid var(--line);font-size:16px;word-break:keep-all;line-height:1.45}
.opt.ok{background:var(--ok);border-color:var(--leaf2);color:var(--okink)}
.opt.no{background:var(--no);border-color:#E24B4A;color:var(--noink)}
.pill{border-radius:999px;padding:10px 18px;background:var(--card);border:1.5px solid var(--line);font-size:15px}
.reward{text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center}
.gifts{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.gift{background:var(--bg);border-radius:20px;padding:10px 12px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:13px;min-width:88px}
.gift svg,.gift canvas{width:48px;height:48px;image-rendering:pixelated}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab{border-radius:999px;padding:7px 14px;background:var(--card);border:2px solid var(--line);font-size:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:8px}
.it{aspect-ratio:1;border-radius:18px;background:var(--bg);border:2px solid transparent;display:grid;place-items:center;position:relative;overflow:hidden}
.it svg,.it canvas{width:72%;height:72%;image-rendering:pixelated}
.it.sel{border-color:var(--leaf2);background:var(--ok)}
.it.lock{opacity:.4}
.dots{display:flex;gap:6px;justify-content:center;margin-top:10px}
.dot{width:26px;height:26px;border-radius:50%;border:2px solid var(--line)}
.dot.sel{border-color:var(--ink)}
.dex{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.cell{border-radius:18px;background:var(--bg);padding:8px 2px;text-align:center;font-size:12px;word-break:keep-all;line-height:1.3;display:flex;flex-direction:column;align-items:center;gap:2px}
.cell canvas{width:48px;height:43px;image-rendering:pixelated}
.cell small{color:var(--muted);font-size:11px;font-variant-numeric:tabular-nums}
.note{font-size:14px;color:var(--muted);text-align:center;min-height:22px}
.confetti{position:absolute;width:6px;height:6px;top:-8px;animation:fall 1.4s linear forwards}
@keyframes fall{to{transform:translateY(170px) rotate(220deg)}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}</style>
</head>
<body>

<div class="wrap">

<section id="home">
<div class="wrap">
<div class="top"><h1>알콩이 징검다리</h1></div>
<div class="hero"><div class="stage" id="hstage"></div>
<div class="chips"><div class="chip">건넌 강<b id="cCross">0번</b></div><div class="chip">콩 친구<b id="cFr">0 / 10</b></div><div class="chip">오답 주머니<b id="cBag">0개</b></div></div></div>
<button class="big" id="goPick">강 건너기</button>
<div class="row2"><button class="mid" id="goReview">복습 강<small id="rvSub">틀린 속담 0개</small></button><button class="mid" id="goCloset">옷장<small id="clSub">꾸미기 0개</small></button><button class="mid" id="goDex">콩 도감<small id="dxSub">친구 0명</small></button></div>
<div class="note" id="homeNote"></div>
</div>
</section>

<section id="pick" hidden>
<div class="wrap">
<div class="top"><h2>어느 강을 건널까?</h2><button class="pill back">처음으로</button></div>
<div class="card"><div class="lab">속담 범위 · 콩 친구는 그 주 10개를 모두 한 번 이상 맞히면 만나요</div><div class="weeks" id="weeks"></div></div>
<div class="card"><div class="lab">문제 모양</div><div class="seg" id="types"></div></div>
<button class="big" id="start">출발!</button>
</div>
</section>

<section id="play" hidden>
<div class="wrap">
<div class="top"><button class="pill" id="quit">그만하기</button><span class="prog" id="prog"></span></div>
<div class="river" id="river"><div class="strip" id="strip"></div><div id="msg"></div></div>
<div id="qa" class="wrap" style="gap:10px">
<div class="card"><div class="qt" id="qt"></div><div class="q" id="q"></div></div>
<div class="opts" id="opts"></div>
</div>
<div id="done" class="card reward" hidden></div>
</div>
</section>

<section id="closet" hidden>
<div class="wrap">
<div class="top"><h2>알콩이 옷장</h2><button class="pill back">처음으로</button></div>
<div class="hero" style="justify-content:center"><div class="stage" id="cstage"></div></div>
<div class="tabs" id="tabs"></div>
<div class="card"><div class="grid" id="items"></div><div class="dots" id="dots"></div></div>
<div class="note" id="clNote"></div>
</div>
</section>

<section id="dexv" hidden>
<div class="wrap">
<div class="top"><h2>콩 친구 도감</h2><button class="pill back">처음으로</button></div>
<div class="card"><div class="dex" id="dex"></div></div>
<div class="card" id="shinyCard"><div class="lab">반짝 콩 친구 · 친구 10명을 다 만난 뒤, 한 주 강을 한 번도 안 틀리고 건너면 만나요</div><div class="dex" id="shiny"></div></div>
<div class="note" id="dxNote"></div>
</div>
</section>

</div>
<script>
const P=[
["가는 날이 장날이다","뜻하지 않은 일이 우연하게도 잘 들어맞았을 때 쓰는 말","장날"],
["가는 말이 고와야 오는 말이 곱다","내가 남에게 좋게 해야 남도 내게 잘한다는 말","고와야"],
["가랑비에 옷 젖는 줄 모른다","재산 같은 것이 조금씩 없어지는 줄 모르게 줄어 들어가는 것","가랑비"],
["가랑잎이 솔잎더러 바스락거린다고 한다","제 결점이 큰 줄 모르고 남의 작은 허물을 탓한다는 말","솔잎"],
["가재는 게 편이라","형편이 비슷하고 인연 있는 것끼리 서로 편이 되어 사정을 보아 줌","가재"],
["가지 많은 나무에 바람 잘 날 없다","자식 많은 사람은 걱정이 떠날 때가 없다는 뜻","바람"],
["간에 가 붙고 쓸개에 가 붙는다","조금이라도 이로운 일이라면 체면도 버리고 아무에게나 아첨한다는 뜻","쓸개"],
["간에 기별도 안 간다","음식을 조금밖에 먹지 못하여 양에 차지 않을 때 쓰는 말","기별"],
["간이 콩알만해지다","겁이 나서 몹시 두려워진다는 뜻","콩알"],
["갈수록 태산","어려운 일을 당할수록 점점 더 어려운 일이 닥쳐온다는 뜻","태산"],
["값싼 것이 비지떡","값이 싸면 품질도 좋지 못하다는 뜻","비지떡"],
["같은 값이면 다홍치마","이왕 같은 값이면 자기에게 더 좋은 것을 고른다는 말","다홍치마"],
["개구리 올챙이 적 생각을 못한다","형편이 나아지면 어렵던 예전 때를 생각하지 못한다는 뜻","올챙이"],
["개밥에 도토리","여럿 속에 어울리지 못하는 사람을 뜻하는 말","도토리"],
["개천에서 용 난다","변변하지 못한 집안에서 훌륭한 인물이 나왔을 때 쓰는 말","용"],
["고기는 씹어야 맛이요, 말은 해야 맛이라","속으로만 애태우지 말고 할 말은 속 시원히 해야 한다는 말","고기"],
["고래 싸움에 새우 등 터진다","힘센 사람들끼리 싸우는 통에 약한 사람이 아무 관계없이 해를 입을 때 쓰는 말","새우"],
["고양이 목에 방울 달기","실행하기 어려운 일을 공연히 의논함을 빗대어 이르는 말","방울"],
["공든 탑이 무너지랴","정성을 다하여 한 일은 헛되지 않아 반드시 좋은 결과를 얻는다는 뜻","탑"],
["구더기 무서워 장 못 담글까","방해되는 일이 있더라도 마땅히 할 일은 해야 한다는 말","구더기"],
["구슬이 서 말이라도 꿰어야 보배라","아무리 훌륭한 일이라도 끝을 맺어 놓아야 가치가 있다는 말","구슬"],
["귀에 걸면 귀걸이, 코에 걸면 코걸이","이런 것도 같고 저런 것도 같아 어느 한쪽으로 정하기 어려울 때 하는 말","귀걸이"],
["그림의 떡","보기는 해도 먹을 수도 가질 수도 없어 아무 소용이 없는 경우","그림"],
["금강산도 식후경","아무리 좋은 것도 배가 부르고 난 뒤에야 좋은 줄 안다는 말","금강산"],
["뛰는 놈 위에 나는 놈 있다","아무리 재주가 있어도 더 나은 사람이 있으니 너무 자랑하지 말라는 뜻","나는"],
["까마귀 날자 배 떨어진다","아무 관계없이 한 일이 다른 일과 때가 겹쳐 의심을 받을 때 쓰는 말","까마귀"],
["꿩 대신 닭","쓰려는 것이 없을 때 그와 비슷한 것으로 대신 쓸 수도 있다는 말","닭"],
["꿩 먹고 알 먹기","한 가지 일을 하고 두 가지 이익을 볼 때 쓰는 말","알"],
["남의 잔치에 감 놓아라 배 놓아라 한다","쓸데없이 남의 일에 간섭한다는 뜻","잔치"],
["낫 놓고 기역자도 모른다","글자를 전혀 모르는 사람을 두고 하는 말","기역자"],
["낮말은 새가 듣고 밤말은 쥐가 듣는다","비밀히 하는 말도 새어 나가기 쉬우니 말을 항상 조심하라는 뜻","쥐"],
["내 코가 석 자","내 사정이 급해서 남의 사정까지 돌볼 수가 없다는 말","석 자"],
["누워서 침 뱉기","남을 해치려다 도리어 자기 자신이 해를 입는다는 말","침"],
["늦게 배운 도둑이 날 새는 줄 모른다","나이 들어서 시작한 일에 몹시 빠져드는 사람을 두고 하는 말","도둑"],
["다 된 죽에 코 풀기","다 된 일을 망쳐 놓았다는 뜻","죽"],
["달면 삼키고 쓰면 뱉는다","제게 이로우면 이용하고 필요하지 않으면 버린다는 뜻","삼키고"],
["닭 잡아먹고 오리발 내민다","나쁜 일을 하고 간사한 꾀로 숨기려 할 때 쓰는 말","오리발"],
["도둑이 제 발 저리다","죄 지은 사람이 들킬까 두려워 스스로 드러내고 만다는 뜻","발"],
["돌다리도 두들겨 보고 건너라","아무리 잘 아는 일이라도 조심하여 실수 없게 하라는 뜻","돌다리"],
["되로 주고 말로 받는다","남을 조금 건드렸다가 도리어 크게 당한다는 뜻","말로"],
["등잔 밑이 어둡다","가까이 있는 일을 먼 데 일보다 오히려 모른다는 뜻","등잔"],
["땅 짚고 헤엄치기","아주 쉽게 할 수 있는 일을 가리켜 하는 말","헤엄"],
["똥 묻은 개가 겨 묻은 개 나무란다","자기는 더 큰 흉이 있으면서 남의 작은 흉을 탓한다는 뜻","겨"],
["마른 하늘에 날벼락","뜻밖에 당하는 재난을 이르는 말","날벼락"],
["말 한마디에 천 냥 빚도 갚는다","말을 잘하면 큰 빚도 갚을 수 있다는 말로, 말의 중요성을 나타낸 말","천 냥"],
["목구멍이 포도청","먹고 살기 위해서는 어떤 일이라도 하게 된다는 뜻","포도청"],
["못된 송아지 엉덩이에 뿔 난다","되지 못한 사람이 건방지고 좋지 못한 짓을 한다는 뜻","송아지"],
["믿는 도끼에 발등 찍힌다","믿던 일이나 사람에게 뜻밖에 해를 입는다는 말","도끼"],
["밑 빠진 독에 물 붓기","아무리 애써도 보람이 나타나지 않는 경우에 쓰는 말","독"],
["바늘 도둑이 소 도둑 된다","나쁜 행실은 점점 더 커지니 나쁜 버릇은 아예 들이지 말라는 뜻","바늘"],

const add=(inner,on,sel,click,title)=>{const d=document.createElement('button');d.className='it'+(sel?' sel':'')+(on?'':' lock');if(typeof inner==="string")d.innerHTML=inner;else d.appendChild(inner);d.title=title;d.setAttribute('aria-label',title+(on?'':' (잠김)'));d.onclick=on?click:()=>{$('clNote').textContent="강을 더 건너면 열려요"};box.appendChild(d)};
if(ctab==="g"){BG.forEach((b,i)=>add(`<svg viewBox="-6 -18 76 84" preserveAspectRatio="xMidYMid slice" shape-rendering="crispEdges" style="width:100%;height:100%">${bgSvg(i)}</svg>`,i===0||owns("g"+i),S.bg===i,()=>{S.bg=i;save();$('clNote').textContent=b[0]+" 배경";drawCloset()},b[0]));return}
if(ctab==="s"){add(beanCanvas(B[0]),true,S.skin===-1,()=>{S.skin=-1;save();$('clNote').textContent="원래 알콩이";drawCloset()},"원래 알콩이");
B.forEach((b,i)=>add(beanCanvas(b,met(i)?"":"lock"),met(i),S.skin===i,()=>{S.skin=i;save();$('clNote').textContent=b[0]+" 알콩이로 변신!";drawCloset()},b[0]));
add(beanCanvas(GOLD,goldOK()?"shiny":"lock"),goldOK(),S.skin===10,()=>{S.skin=10;save();$('clNote').textContent="반짝 알콩이로 변신!";drawCloset()},"반짝 알콩이");
if(!img.complete)img.onload=drawCloset;return}
I.forEach((it,i)=>{if(it[0]!==ctab)return;const w=S.wear[ctab],sel=w&&w[0]===i;add(itemSvg(it,1),owns("i"+i),sel,()=>{S.wear[ctab]=sel?null:[i,0];save();$('clNote').textContent=sel?"벗었어요":it[1]+" 착용!";drawCloset()},it[1])});
const w=S.wear[ctab];if(w&&ctab!=="s"){[0,1,2].forEach(v=>{if(v&&!owns("v"+w[0]+"_"+v))return;const d=document.createElement('button');d.className='dot'+(w[1]===v?' sel':'');d.innerHTML=itemSvg(I[w[0]],1,v);d.setAttribute('aria-label',"색깔 "+(v+1));d.onclick=()=>{S.wear[ctab]=[w[0],v];save();drawCloset()};$('dots').appendChild(d)})}}

/* ---------- 도감 ---------- */
function drawDex(){const c=correctSet();$('dex').innerHTML='';B.forEach((b,i)=>{const m=met(i),n=[...Array(10).keys()].filter(k=>c.has(i*10+k)).length;const d=document.createElement('div');d.className='cell';d.appendChild(beanCanvas(b,m?"":"lock"));d.append(m?b[0]:(i+1)+"주 친구");
const s=document.createElement('small');s.textContent=(i*10+1)+"~"+(i*10+10)+"번 · "+(TEACH?10:n)+"/10";d.appendChild(s);$('dex').appendChild(d)});
$('shiny').innerHTML='';B.forEach((b,i)=>{const on=TEACH||S.shiny.includes(i);const d=document.createElement('div');d.className='cell';d.appendChild(beanCanvas(b,on?"shiny":"lock"));d.append(on?"반짝 "+b[0]:"?");$('shiny').appendChild(d)});
$('dxNote').textContent="숫자는 그 주 속담 중 한 번이라도 맞힌 개수예요"}

img.onload=()=>{if(!$('home').hidden)drawHome()};
show("home");
</script>
